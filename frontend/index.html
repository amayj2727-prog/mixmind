<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary App Identity -->
    <title>MIXMIND • The AI DJ in Your Pocket</title>
    <meta name="title" content="MIXMIND • The AI DJ in Your Pocket" />
    <meta name="description" content="Stop being the human jukebox. Drop your playlist or pick a live set. MIXMIND’s AI beat-matches and transitions your music like a pro DJ with downbeat bass swaps and zero awkward silences." />
    <meta name="keywords" content="AI DJ, Party DJ, Automatic Crossfade, Beatmatching, Virtual DJ, Web Audio DJ, Bollytech DJ" />
    <meta name="author" content="MIXMIND Team" />

    <!-- Favicon & PWA App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Colors for Mobile Status Bars -->
    <meta name="theme-color" content="#0D0D11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MIXMIND" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mixmind.app/" />
    <meta property="og:title" content="MIXMIND • The AI DJ in Your Pocket" />
    <meta property="og:description" content="Stop being the human jukebox. MIXMIND’s AI beat-matches and transitions your tracks like a pro DJ—no ₹2 lakh console required." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:site_name" content="MIXMIND" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mixmind.app/" />
    <meta name="twitter:title" content="MIXMIND • The AI DJ in Your Pocket" />
    <meta name="twitter:description" content="Stop being the human jukebox. MIXMIND’s AI beat-matches and transitions your tracks like a pro DJ with downbeat bass swaps." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- High-Performance Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#0D0D11] text-white antialiased selection:bg-[#FF4D00] selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
